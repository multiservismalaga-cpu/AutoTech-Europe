name: Python regression tests

on:
  push:
    branches:
      - vin-hyundai-crosscheck
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autotech_test
        options: >-
          --health-cmd "pg_isready -U postgres -d autotech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autotech_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run SQLite regression tests
        env:
          DATABASE_URL: ""
        run: python -m unittest discover -s tests -p "test_variant_resolution.py" -v
      - name: Run PostgreSQL persistence smoke tests
        run: python -m unittest tests.test_postgres_backend -v

name: Construir instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'assets/**'
      - 'AutoTech_Europe_Windows.spec'
      - 'AutoTech_Europe.iss'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construir AutoTech Europe
        run: python -m PyInstaller --noconfirm AutoTech_Europe_Windows.spec

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Crear instalador
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "AutoTech_Europe.iss"'

      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AutoTech_Europe_Setup
          path: installer/AutoTech_Europe_Setup.exe
          if-no-files-found: error

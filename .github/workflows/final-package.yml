name: Final project package

on:
  push:
    branches:
      - vin-hyundai-crosscheck

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && pip install fastapi uvicorn
      - name: Verify regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build final ZIP
        run: |
          zip -r "AutoTech-Europe-final-$GITHUB_SHA.zip" . \
            -x ".git/*" \
            -x ".github/workflows/final-package.yml" \
            -x "*.pyc" \
            -x "*/__pycache__/*"
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AutoTech-Europe-final
          path: AutoTech-Europe-final-${{ github.sha }}.zip
          retention-days: 90

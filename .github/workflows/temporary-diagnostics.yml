name: Temporary regression diagnostics

on:
  push:
    branches:
      - vin-hyundai-crosscheck

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && pip install fastapi uvicorn
      - name: Capture direct VIN result
        run: python -c "import main; print(main.hyundai_test_vds('KMHHA8110SU155502')); print(main.decode_hyundai_vin_crosscheck('KMHHA8110SU155502'))" > direct.log 2>&1
      - name: Capture regression output
        run: python -m unittest discover -s tests -p "test_*.py" -v > regression.log 2>&1 || true
      - name: Upload regression output
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics
          path: |
            regression.log
            direct.log

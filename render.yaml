services:
  - type: web
    name: autotech-europe
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: autotech-europe-db
          property: connectionString

databases:
  - name: autotech-europe-db
    databaseName: autotech_europe
    user: autotech
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
